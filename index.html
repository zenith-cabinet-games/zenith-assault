function bossSprite(spec){
 const w=48,h=34,g=new Uint8Array(w*h);
 const set=(x,y,c)=>{x|=0;y|=0;if(x>=0&&x<w&&y>=0&&y<h)g[y*w+x]=c;};
 const put=(x,y,c)=>{set(x,y,c);set(w-1-x,y,c);};
 const inPoly=(px,py,pts)=>{let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))ins=!ins;}return ins;};
 for(const p of spec.parts){
  for(let y=0;y<h;y++)for(let x=0;x<w/2;x++){
   let ok=false;

 beam(){return b=>{let t=0;return()=>{t++;if(t<32){b.x+=clamp(pl.x-b.x,-1.4,1.4);b.tele=t;}else if(t<58){b.tele=t;}else if(t<104){if(t===58)SFX.beam();b.tele=0;b.beam={x:b.x,w:12};}else{b.beam=null;b.tele=0;return true;}return false;};};},
 spawn(){return b=>{let t=0;return()=>{if(t===10){SFX.tele();for(let i=0;i<4;i++){const e=makeEnemy(i%2?'hornet':'drone',0,0,0,null,0);e.x=b.x+(i-1.5)*10;e.y=b.y+14;e.noSlot=true;startDive(e,i%2?1:-1);enemies.push(e);}}t++;return t>46;};};},
 charge(){return b=>{let t=0,sy=b.y;return()=>{t++;if(t<30)b.bx_shake=Math.sin(t*2)*2;else if(t<80){b.bx_shake=0;b.y=lerp(sy,H-92,(t-30)/50);b.x+=clamp(pl.x-b.x,-1.1,1.1);}else if(t<140){b.y=lerp(H-92,b.baseY,(t-80)/60);}else{b.y=b.baseY;b.bx_shake=0;return true;}return false;};};},
 tele(){return b=>{let t=0;return()=>{t++;if(t<18)b.alpha=1-t/18;else if(t===18){SFX.tele();b.x=rnd(40,W-40);}else if(t<36)b.alpha=(t-18)/18;else if(t===40){for(let i=0;i<5;i++)ebul(b.x,b.y+10,Math.atan2(pl.y-b.y,pl.x-b.x)+(i-2)*.22,2);b.alpha=1;}else if(t>56){b.alpha=1;return true;}return false;};};}
};
function mkAtk(name,b){const m={fan3:ATK.fan(3,.7),fan5:ATK.fan(5,1.3),fan7:ATK.fan(7,1.9),aim3:ATK.aim(3),aim5:ATK.aim(5),ring12:ATK.ring(12),ring20:ATK.ring(20),spiral2:ATK.spiral(2),spiral3:ATK.spiral(3),rain:ATK.rain(),beam:ATK.beam(),spawn:ATK.spawn(),charge:ATK.charge(),tele:ATK.tele()};return m[name](b);}
function updBoss(){const b=boss;if(!b)return;b.t++;if(b.flash>0)b.flash--;
 if(b.dying>0){b.dying--;if(b.dying%4===0){boom(b.x+rnd(-b.hw,b.hw),b.y+rnd(-b.hh,b.hh),['#fff','#fa3','#f33'][irnd(0,2)],10,2);SFX.pop();}if(b.dying%14===0)SFX.boom();shake=6;if(b.dying===0){b.dead=true;boom(b.x,b.y,'#fff',60,3.2);boom(b.x,b.y,'#fa3',50,2.4);SFX.big();flash=16;addScore(2000+stage*200);dropPup(b.x-10,b.y,true);dropPup(b.x+10,b.y,true);for(const e of enemies){e.dead=true;boom(e.x,e.y,'#fd3',6);}endStage();}return;}
 if(b.intro>0){b.intro--;b.y=lerp(-40,b.baseY,1-b.intro/130);b.x=W/2;return;}
 const sp=b.spec;
 if(!b.act){switch(sp.move){case'sway':b.x=W/2+Math.sin(b.t*.02)*66;break;case'fig8':b.x=W/2+Math.sin(b.t*.025)*70;b.y=b.baseY+Math.sin(b.t*.05)*14;break;case'bounce':b.x+=b.vx*(1+b.phase*.25);if(b.x<34||b.x>W-34)b.vx=-b.vx;break;case'hover':b.x+=(pl.x-b.x)*.012;b.y=b.baseY+Math.sin(b.t*.04)*6;break;case'tele':break;}}
 else if(!b.act.keepMove){if(sp.move==='fig8'&&!b.beam)b.y=lerp(b.y,b.baseY,.05);}
 const ratio=b.hp/b.mhp,ph=ratio<=.33?2:ratio<=.66?1:0;if(ph>b.phase){b.phase=ph;b.cd=20;boom(b.x,b.y,'#fff',20,2);SFX.boom();shake=8;pops.push({x:W/2,y:H/2-30,t:60,s:'ENRAGED!',c:'#f55'});}
 if(ratio<=b.nextDrop){b.nextDrop-=.25;dropPup(b.x,b.y+10,true);}
 if(!pl.alive)return;
 if(b.act){if(b.act()){b.act=null;b.cd=Math.max(24,64-b.phase*14-Math.round(diff*10));}return;}
 if(--b.cd<=0){const list=sp.atk,n=Math.min(list.length,2+b.phase+(stage>25?1:0));let name=list[irnd(0,n-1)];if(name===b.last&&n>1)name=list[irnd(0,n-1)];b.last=name;b.act=mkAtk(name,b);}
}
function hitBoss(dmg){const b=boss;if(!b||b.dying>0||b.dead)return;b.hp-=dmg;b.flash=3;if(b.hp<=0){b.hp=0;b.dying=95;b.act=null;b.beam=null;b.tele=0;eB=[];SFX.big();}}

/* ---------- main update ---------- */
function updStars(){const m=mode==='intro'?2.4:(mode==='title'?1:1);for(const s of stars){s.y+=s.z*m;if(s.y>H){s.y=0;s.x=rnd(0,W);}}}
function pauseGame(){if(mode==='play'||mode==='intro'){prevMode=mode;mode='paused';}}
function update(){
 tick++;modeT++;updStars();
 const typing=mode==='entry';
 if(!typing&&pressed.KeyM)muted=!muted;
 if(!typing&&pressed.KeyC){crtOn=!crtOn;resize();}
 if(!typing&&pressed.KeyF){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}}
 const g=pad(),gStart=g&&g.start&&!padPrev;padPrev=!!(g&&g.start);
 const dyNow=g&&Math.abs(g.dy)>.6?Math.sign(g.dy):0;if(dyNow&&dyNow!==padDy)pressed[dyNow<0?'ArrowUp':'ArrowDown']=true;padDy=dyNow;
 const fNow=!!(g&&g.fire);if(fNow&&!padFire)pressed.GamepadA=true;padFire=fNow;if(gStart)pressed.GamepadStart=true;
 const startKey=pressed.Enter||pressed.Space||gStart||pressed.GamepadA;
 if(flash>0)flash--;if(shake>0)shake--;
 switch(mode){
  case'title':if(startKey||(g&&g.fire&&modeT>20)){newGame(qStage);}break;
  case'intro':{const inp=readInput();movePlayer(inp);firePlayer(inp);updP();updParts();updPops();if(pressed.KeyP||pressed.Escape)pauseGame();if(modeT>=introLen)beginWave();break;}
  case'play':case'dying':updPlay();break;
  case'clear':{if(pl.alive){const inp=readInput();movePlayer(inp);firePlayer(inp);}updP();updPups();updParts();updPops();if(modeT>=(clearInfo&&clearInfo.chal?230:190))startStage_(stage+1);break;}
  case'gameover':updParts();updPops();if((modeT>90&&startKey)||modeT>260){if(score>0&&qualifies(score))startEntry();else{mode='title';modeT=0;}}break;
  case'entry':updEntry();break;
  case'scores':if((modeT>60&&startKey)||modeT>720){mode='title';modeT=0;}break;
  case'paused':if(pressed.KeyP||pressed.Escape||pressed.Enter)mode=prevMode;break;
 }
 pressed={};
}
function updP(){for(const b of pB)b.y+=b.vy;pB=pB.filter(b=>b.y>-8);}
function updParts(){for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.l--;}parts=parts.filter(p=>p.l>0);}
function updPops(){for(const p of pops){p.t--;p.y-=.35;}pops=pops.filter(p=>p.t>0);}
function updPups(){for(const u of pups){u.y+=.8;if(pl.alive&&Math.abs(u.x-pl.x)<(pl.twin?18:10)&&Math.abs(u.y-pl.y)<12){u.got=true;applyPup(u.k);}}pups=pups.filter(u=>!u.got&&u.y<H+8);}
function updPlay(){
 const alive=pl.alive;
 if(alive){const inp=readInput();movePlayer(inp);firePlayer(inp);if(pressed.KeyP||pressed.Escape)pauseGame();}
 updP();
 for(const e of enemies)updEnemy(e);
 updBoss();
 for(const b of eB){b.x+=b.vx;b.y+=b.vy;}eB=eB.filter(b=>b.y<H+6&&b.y>-24&&b.x>-6&&b.x<W+6);
 updPups();updParts();updPops();
 /* dive scheduling */
 if(alive&&stType!=='chal'&&mode==='play'){
  const form=enemies.filter(e=>e.st==='form'),divers=enemies.filter(e=>e.st==='dive'&&!e.noSlot).length,busy=enemies.some(e=>e.st==='wait'||e.st==='entry');
  if(--diveTimer<=0){const maxD=Math.min(2+Math.floor(stage/3),9)+(enemies.length<=6?2:0);if(form.length&&divers<maxD&&(!busy||stage>6)&&stType==='normal'){const e=form[irnd(0,form.length-1)];startDive(e);if(Math.random()<.35+diff*.3&&form.length>3){const nb=form.find(o=>o!==e&&o.st==='form'&&Math.abs(o.c-e.c)<=1&&o.r===e.r);if(nb)startDive(nb,e.dir);}}
   diveTimer=Math.max(14,irnd(46,110)*(1-diff*.5)*(enemies.length<=6?.5:1));}
  if(tick%100===0&&Math.random()<diff*.8&&form.length){const e=form[irnd(0,form.length-1)];enemyShoot(e);}
 }
 /* collisions: player bullets */
 for(const b of pB){
  if(b.dead)continue;
  for(const e of enemies){if(e.dead||!e.vis||e.y<-4||e.st==='wait')continue;const d=ET[e.type];if(Math.abs(b.x-e.x)<d.hw&&Math.abs(b.y-e.y)<d.hh+2){b.dead=true;stHits++;e.hp--;e.flash=3;if(e.hp<=0)killEnemy(e);else{SFX.hit();boom(e.x,e.y,'#fff',3,1);}break;}}
  if(!b.dead&&boss&&boss.intro<=0&&boss.dying===0&&boss.alpha>.5&&Math.abs(b.x-boss.x)<boss.hw&&Math.abs(b.y-boss.y)<boss.hh){b.dead=true;stHits++;hitBoss(1);addScore(10);boom(b.x,b.y,'#fff',2,1.2);SFX.hit();}
 }
 pB=pB.filter(b=>!b.dead);enemies=enemies.filter(e=>!e.dead);
 /* enemy bullets / bodies vs player */
 if(pl.alive){
  const xs=shipXs();
  for(const b of eB){for(const sx of xs){if(Math.abs(b.x-sx)<(b.k==='m'?5:4)&&Math.abs(b.y-pl.y)<(b.k==='m'?6:6)){b.dead=true;hurtPlayer();break;}}}
  eB=eB.filter(b=>!b.dead);
  for(const e of enemies){if(e.st==='dive'||e.st==='entry'){for(const sx of xs){if(Math.abs(e.x-sx)<9&&Math.abs(e.y-pl.y)<9){killEnemy(e);hurtPlayer();break;}}}}
  enemies=enemies.filter(e=>!e.dead);
  if(boss&&boss.intro<=0&&boss.dying===0){for(const sx of xs){if(Math.abs(boss.x-sx)<boss.hw*.95&&Math.abs(boss.y-pl.y)<boss.hh+4)hurtPlayer();if(boss.beam&&Math.abs(boss.beam.x-sx)<boss.beam.w/2+3)hurtPlayer();}}
 }
 /* mode transitions */
 if(mode==='dying'&&modeT>115){if(lives>0){pl.alive=true;pl.inv=160;pl.x=W/2;mode='play';modeT=0;pB=[];}else{mode='gameover';modeT=0;SFX.over();}}
 else if(mode==='play'){
  if(stType==='boss'){/* ends inside updBoss */}
  else if(enemies.length===0)endStage();
 }
}

 const cols=['#ff3a3a','#ff9a2a','#ffd23a','#6aff8a','#4adaff','#b86bff'],ord=['1ST','2ND','3RD'];
 textS('HIGH SCORES',W/2,34,'#ffd23a',2,'c');
 text('RANK',20,62,'#4adaff',1);text('NAME',62,62,'#4adaff',1);text('SCORE',W-62,62,'#4adaff',1,'r');text('STG',W-20,62,'#4adaff',1,'r');
 for(let i=0;i<10;i++){const y=76+i*16,s=scores[i];if(!s)continue;const hot=i===hl,c=hot?((tick>>2)&1?'#fff':'#ffd23a'):cols[Math.min(i,5)];
  text(ord[i]||(i+1)+'TH',20,y,c,1);text(s.n,62,y,c,1);text(String(s.s),W-62,y,c,1,'r');text(String(s.st),W-20,y,c,1,'r');}
}
function drawEntry(){
 const e=entry,blink=(tick>>3)&1;
 textS('CONGRATULATIONS!',W/2,40,'#ffd23a',2,'c');
 text('YOUR SCORE RANKS',W/2,72,'#fff',1,'c');
 const ord=['1ST','2ND','3RD'][e.rank]||(e.rank+1)+'TH';
 textS(ord,W/2,86,'#ff3a3a',4,'c');
 text('SCORE '+score,W/2,118,'#4adaff',1,'c');text('STAGE '+stage,W/2,130,'#4adaff',1,'c');
 text('ENTER YOUR INITIALS',W/2,156,'#fff',1,'c');
 for(let i=0;i<3;i++){const x=W/2-36+i*28,ch=i<e.pos?CH[e.c[i]]:(i===e.pos?CH[e.c[i]]:'_');
  textS(ch,x,176,i===e.pos?(blink?'#ffd23a':'#ff9a2a'):'#fff',5);
  if(i===e.pos){ctx.fillStyle=blink?'#ffd23a':'#664';ctx.fillRect(x-1,204,17,2);}}
 text('UP DOWN CHANGE   FIRE OK',W/2,222,'#6aff8a',1,'c');text('OR JUST TYPE YOUR INITIALS',W/2,234,'#6aff8a',1,'c');
 text('TIME '+Math.max(0,Math.ceil(e.t/60)),W/2,254,e.t<600?'#ff3a3a':'#fff',1,'c');
}
function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 if(shake>0)ctx.translate(Math.round(rnd(-1,1)*Math.min(3,shake/3)),Math.round(rnd(-1,1)*Math.min(3,shake/3)));
 drawStars();
 if(mode==='title'){drawTitle();ctx.setTransform(1,0,0,1,0,0);return;}
 if(mode==='entry'||mode==='scores'){text('1UP',8,3,'#661a1a',1);text(String(score),8,10,'#fff',2);text('HIGH SCORE',W/2,3,'#ff3a3a',1,'c');text(String(hi),W/2,10,'#fff',2,'c');if(mode==='entry')drawEntry();else{drawScoreTable(entry.rank);if(modeT>60&&(tick>>4)&1)text('PRESS START',W/2,248,'#fff',1,'c');}ctx.setTransform(1,0,0,1,0,0);return;}
 for(const u of pups)drawPup(u);
 for(const e of enemies)drawEnemy(e);
 drawBoss();
 for(const b of pB){ctx.fillStyle='#8cf';ctx.fillRect((b.x|0)-1,b.y|0,2,6);ctx.fillStyle='#fff';ctx.fillRect(b.x|0,(b.y|0)+1,1,4);}
 for(const b of eB)drawEB(b);
 drawPlayer();
 for(const p of parts){ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.l/14);ctx.fillRect(p.x|0,p.y|0,2,2);}ctx.globalAlpha=1;
 for(const p of pops)text(p.s,p.x,p.y,p.c,1,'c');
 drawHUD();drawBanner();
 if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash/14)+')';ctx.fillRect(0,0,W,H);}
 ctx.setTransform(1,0,0,1,0,0);
}

/* ---------- loop ---------- */
const qStage=1;
let last=performance.now(),acc=0;const STEP=1000/60;
function frame(now){acc+=Math.min(100,now-last)*dbg.fast;last=now;let n=0;while(acc>=STEP&&n++<600){update();acc-=STEP;}render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
